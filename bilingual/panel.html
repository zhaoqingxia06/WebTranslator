<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#fbfaf8;color:#282722;font:16px/1.8 system-ui}header{position:sticky;top:0;z-index:5;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fbfaf8ed;backdrop-filter:blur(8px);border-bottom:1px solid #ece8e3}header strong{font-size:15px}select{border:1px solid #dedbd5;border-radius:8px;background:white;padding:7px 10px;font:inherit;font-size:13px}#status{font-size:12px;color:#8b8278;padding:2px 20px}#out{padding:18px 26px 45vh;max-width:780px;margin:auto}.block{display:flow-root;position:relative;overflow-wrap:anywhere}.block>*{margin:0}.block h1{font-size:28px;line-height:1.25}.block h2{font-size:22px;line-height:1.35}.block h3,.block h4{font-size:19px;line-height:1.4}.block.heading{color:#75452e}.block:not(:last-child){margin-bottom:20px}.hit{background:#fff0b8;outline:5px solid #fff0b8;border-radius:3px}.placeholder{background:#f2eee9;border:1px solid #e8e1d8;border-radius:12px;color:#a49789;display:grid;place-items:center;min-height:80px;font-size:13px}.empty{display:grid;place-items:center;text-align:center;color:#a09b93;min-height:55vh}.empty svg{width:105px;opacity:.65}.failed{color:#a33}button{border:0;background:none;color:#82553f;text-decoration:underline;cursor:pointer;font:inherit}mark.selected-translation{background:#efb59d;color:#3a2018;border-radius:2px;padding:0 .04em;box-decoration-break:clone;-webkit-box-decoration-break:clone}#selection-status{position:fixed;bottom:16px;right:20px;z-index:10;padding:4px 10px;border-radius:8px;background:#302722;color:#fff;font-size:12px;box-shadow:0 2px 10px #0002}#selection-status:empty{display:none}</style><header><strong>双语对照</strong><select id="lang" aria-label="目标语言"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option><option value="pt">Português</option><option value="it">Italiano</option><option value="ru">Русский</option><option value="ar">العربية</option></select></header><div id="status" aria-live="polite"></div><main id="out"></main><script src="panel.js"></script></html>
